[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "couponify"
version = "0.1.0"
description = "Simulador de carrinho de compras de marketplace com descontos dinamicos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "coverage>=7",
    "hypothesis>=6",
    "mutmut>=2.4,<3",
]

[project.scripts]
couponify = "couponify.cli:run"

[tool.setuptools.packages.find]
include = ["couponify*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["couponify"]
branch = true
omit = ["couponify/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
